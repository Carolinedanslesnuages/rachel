name: taille-fichiers

# Un fichier, une responsabilité : un fichier de code ne dépasse pas 400 lignes non vides, un
# fichier de test 600. Un fichier plus long venu d'avant (projet repris) est toléré tant qu'il ne
# grossit pas : on le découpe quand on y travaille. Contrôle fourni par Constance, épinglé à une version.
on:
  pull_request:

permissions:
  contents: read

jobs:
  taille:
    name: Taille des fichiers (une responsabilité par fichier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: Carolinedanslesnuages/constance/taille-fichiers@df8fc5f62f37d23bf8189e24c887f1ee6b3c5b97 # v1.2.0
